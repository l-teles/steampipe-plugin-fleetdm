name: Stale Issues and PRs
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Set to true for a dry run
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  stale_workflow:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: turbot/steampipe-workflows/.github/workflows/stale.yml@210ab7cc3f105a795a389cf30d68c394ee46af5e # main 2026-07-29
    secrets:
      SECURITY_API_TOKEN: ${{ secrets.SECURITY_API_TOKEN }}
    with:
      dryRun: ${{ github.event.inputs.dryRun }}
